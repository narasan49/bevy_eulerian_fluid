[package]
name = "bevy_eulerian_fluid"
version = "0.4.0"
edition = "2021"
description = "An eularian fluid simulation plugin for Bevy."
categories = ["game-development", "science", "simulation"]
keywords = ["bevy", "fluid", "simulation", "physics", "graphics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/narasan49/bevy_eulerian_fluid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
members = [
    "crates/*",
]

[dependencies]
bevy = {version = "0.18", default-features = false, features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_sprite_render"
]}
avian2d = "0.6"
bytemuck = "1.24.0"
bevy_eulerian_fluid_3d = {path = "crates/euler_fluid_3d", optional = true}
bevy_marching_cubes_sdf = {path = "crates/bevy_marching_cubes_sdf", optional = true}

[features]
3d = ["dep:bevy_eulerian_fluid_3d", "dep:bevy_marching_cubes_sdf"]


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
bevy = {version = "0.18", default-features = false, features = [
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_winit",
    "bevy_window",
    "debug",
    "default_font",
    "https",
    "png",
    "x11",
    "webgpu",
    "3d_bevy_render",
]}
example_utils = { path = "crates/example_utils" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev-debug]
inherits = "dev"
opt-level = 0

[[example]]
name = "water_surface_3d"
path = "examples/3d/water_surface.rs"
required-features = ["3d", "bevy/free_camera"]